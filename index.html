<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificador de modelos gratuitos - OpenRouter</title>
<style>
:root { --bg: #fff; --fg: #111; --border: #999; --ok: green; --fail: red; --pending: gray; }
* { box-sizing: border-box; }
body { font-family: monospace; max-width: 800px; margin: 0 auto; padding: 20px 16px; background: var(--bg); color: var(--fg); min-height: 100vh; line-height: 1.5; font-size: 14px; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; gap: 18px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls input { flex: 1; min-width: 200px; max-width: 320px; }
input, button { font-family: inherit; }
input { padding: 6px; font-size: 14px; }
label { font-weight: bold; }
button { padding: 8px 14px; font-size: 14px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
table { border-collapse: collapse; width: 100%; margin-top: 12px; flex: 1; min-height: 60vh; }
th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; font-size: 13px; }
.ok { color: var(--ok); }
.fail { color: var(--fail); }
.pending { color: var(--pending); }
#status { font-size: 15px; padding: 6px 0; min-height: 22px; }
</style>
</head>
<body>

<main>
<div class="controls">
<label for="key">API Key de OpenRouter:</label>
<input type="password" id="key" aria-label="API Key">
<button id="run">Verificar modelos gratuitos</button>
</div>
<p id="status"></p>
<table id="tbl" style="display:none">
<thead><tr><th>Modelo</th><th>Estado</th><th>Detalle</th></tr></thead>
<tbody id="body"></tbody>
</table>
</main>

<script>
const btn = document.getElementById('run');
const keyInput = document.getElementById('key');
keyInput.value = localStorage.getItem('openrouter_key') || '';
keyInput.addEventListener('input', () => localStorage.setItem('openrouter_key', keyInput.value));
const statusEl = document.getElementById('status');
const tbl = document.getElementById('tbl');
const body = document.getElementById('body');

btn.onclick = async () => {
  const key = keyInput.value.trim();
  if (!key) { statusEl.textContent = 'Falta la API key.'; return; }
  body.innerHTML = '';
  tbl.style.display = 'none';
  statusEl.textContent = 'Obteniendo lista de modelos...';

  let models;
  try {
    const res = await fetch('https://openrouter.ai/api/v1/models', {
      headers: { 'Authorization': 'Bearer ' + key }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    models = data.data.filter(m => m.id.endsWith(':free'));
  } catch (e) {
    statusEl.textContent = 'Error al obtener modelos: ' + e.message;
    return;
  }

  statusEl.textContent = 'Modelos gratuitos encontrados: ' + models.length + '. Probando cada uno...';
  tbl.style.display = 'table';

  for (const m of models) {
    let timeoutId;
    const row = document.createElement('tr');
    row.innerHTML = '<td>' + m.id + '</td><td class="pending">probando...</td><td></td>';
    body.appendChild(row);

    try {
      const start = Date.now();
      const controller = new AbortController();
      timeoutId = setTimeout(() => controller.abort(), 30000);
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + key,
          'Content-Type': 'application/json'
        },
        signal: controller.signal,
        body: JSON.stringify({
          model: m.id,
          messages: [{ role: 'user', content: 'hola' }],
          max_tokens: 1
        })
      });
      clearTimeout(timeoutId);
      const dur = Date.now() - start;
      const j = await res.json().catch(() => ({}));
      if (res.ok && !j.error) {
        row.children[1].textContent = 'OK';
        row.children[1].className = 'ok';
        row.children[2].textContent = dur + 'ms';
      } else {
        row.children[1].textContent = 'FALLA';
        row.children[1].className = 'fail';
        row.children[2].textContent = ((j.error && j.error.message) || ('HTTP ' + res.status)) + ' (' + dur + 'ms)';
      }
    } catch (e) {
      const dur = Date.now() - start;
      clearTimeout(timeoutId);
      if (e.name === 'AbortError') {
        row.children[1].textContent = 'TIMEOUT';
        row.children[1].className = 'pending';
        row.children[2].textContent = 'Timeout nativo del sitio (30s) (' + dur + 'ms)';
      } else if (e.message && e.message.toLowerCase().includes('timeout')) {
        row.children[1].textContent = 'TIMEOUT';
        row.children[1].className = 'pending';
        row.children[2].textContent = 'Timeout del proveedor: ' + e.message + ' (' + dur + 'ms)';
      } else {
        row.children[1].textContent = 'FALLA';
        row.children[1].className = 'fail';
        row.children[2].textContent = e.message + ' (' + dur + 'ms)';
      }
    }
  }

  statusEl.textContent = 'Verificación completa.';
};
</script>

</body>
</html>
