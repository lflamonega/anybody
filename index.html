<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anybody — verificador de modelos para openrouter</title>
  <meta name="description" content="verificador minimalista de disponibilidad y latencia para modelos gratuitos de openrouter.">
  <meta name="keywords" content="openrouter, modelos gratuitos, ia, llm, benchmark, latencia, api">
  <meta name="author" content="laureano lamonega">
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
      --border: #ccc;
      --input-bg: #fff;
      --surface: #f4f4f4;
      --muted: #666;
      --link: #0066cc;
      --error: #d32f2f;
      --error-bg: rgba(211, 47, 47, 0.08);
      --success: #2e7d32;
      --success-bg: rgba(46, 125, 50, 0.08);
      --warning: #e65100;
      --warning-bg: rgba(230, 81, 0, 0.08);
      --accent: #222222;
      --accent-fg: #fff;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --fg: #e0e0e0;
      --border: #333;
      --input-bg: #1e1e1e;
      --surface: #1a1a1a;
      --muted: #999;
      --link: #66b2ff;
      --error: #f44336;
      --error-bg: rgba(244, 67, 54, 0.1);
      --success: #4caf50;
      --success-bg: rgba(76, 175, 80, 0.1);
      --warning: #ff9800;
      --warning-bg: rgba(255, 152, 0, 0.1);
      --accent: #e0e0e0;
      --accent-fg: #121212;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .brand-title {
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--fg);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    #theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      width: 28px;
      height: 28px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 0;
    }

    #theme-toggle:hover { opacity: 0.7; }

    /* ── Layout ── */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Card & Fields ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem;
    }

    .field { margin-bottom: 0.75rem; }
    .field:last-child { margin-bottom: 0; }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 0.3rem;
      color: var(--fg);
    }

    .tag {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted);
    }

    .input-row {
      display: flex;
      gap: 0.4rem;
    }

    .field input,
    .field select,
    .settings-bar select,
    .settings-bar input,
    .search-input {
      padding: 0.5rem 0.65rem;
      background: var(--input-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 0;
      font: inherit;
      outline: none;
      font-size: 0.85rem;
    }

    .field input:focus,
    .field select:focus,
    .settings-bar select:focus,
    .settings-bar input:focus,
    .search-input:focus {
      border-color: var(--fg);
    }

    .field input::placeholder,
    .search-input::placeholder {
      color: var(--muted);
    }

    .btn {
      padding: 0.5rem 0.8rem;
      background: var(--accent);
      color: var(--accent-fg);
      border: 1px solid var(--accent);
      border-radius: 0;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      user-select: none;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface);
      color: var(--fg);
      border-color: var(--border);
    }

    .btn-danger {
      background: var(--error);
      color: #fff;
      border-color: var(--error);
    }

    .btn-sm {
      padding: 0.2rem 0.45rem;
      font-size: 0.75rem;
      font-weight: normal;
      font-family: monospace;
    }

    .key-info {
      font-size: 0.78rem;
      margin-top: 0.35rem;
      font-family: monospace;
      color: var(--muted);
    }

    /* ── Settings Bar ── */
    .settings-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.5rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
    }

    .settings-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* ── Action Bar ── */
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    /* ── Stats & Progress ── */
    .stats-bar {
      font-family: monospace;
      font-size: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      padding: 0.5rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
    }

    .stat-item {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .stat-ok { color: var(--success); }
    .stat-fail { color: var(--error); }
    .stat-warn { color: var(--warning); }

    .progress-line {
      height: 2px;
      background: var(--border);
      width: 100%;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--fg);
      width: 0%;
      transition: width 0.2s ease;
    }

    /* ── Filters & Search ── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .filter-group {
      display: flex;
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: var(--bg);
      border: none;
      border-right: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      font-size: 0.78rem;
      font-family: inherit;
      color: var(--muted);
      cursor: pointer;
    }

    .tab-btn:last-child { border-right: none; }
    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 700;
    }

    .search-input {
      min-width: 220px;
    }

    .export-group {
      display: flex;
      gap: 0.3rem;
    }

    /* ── Table ── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      text-align: left;
    }

    th {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.45rem 0.6rem;
      font-weight: 700;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      white-space: nowrap;
    }

    td {
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface); }

    .mono { font-family: monospace; }
    .model-name { font-weight: 600; }
    .model-sub { font-size: 0.72rem; color: var(--muted); }

    .status-tag {
      font-family: monospace;
      font-size: 0.74rem;
      font-weight: 700;
      display: inline-block;
    }

    .status-tag.ok { color: var(--success); }
    .status-tag.fail { color: var(--error); }
    .status-tag.timeout { color: var(--warning); }
    .status-tag.testing { color: var(--link); }
    .status-tag.pending { color: var(--muted); }

    .error-text {
      font-size: 0.75rem;
      color: var(--muted);
      word-break: break-all;
      max-width: 320px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--accent);
      color: var(--accent-fg);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      font-size: 0.78rem;
      font-family: monospace;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <span class="brand-title">anybody — openrouter free models</span>
    <div class="header-actions">
      <button id="theme-toggle" title="cambiar tema" aria-label="cambiar tema">◑</button>
    </div>
  </header>

  <main>
    <!-- Config Card -->
    <div class="card">
      <div class="field">
        <label for="api-key">api key <span class="tag">(<a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener noreferrer">openrouter.ai/settings/keys</a>)</span></label>
        <div class="input-row">
          <input id="api-key" type="password" placeholder="sk-or-v1-..." style="flex:1;" autocomplete="off" spellcheck="false">
          <button type="button" id="toggle-key-btn" class="btn btn-secondary btn-sm" title="mostrar/ocultar api key">ver</button>
        </div>
        <div id="key-info" class="key-info"></div>
      </div>

      <div class="settings-bar">
        <div class="settings-item">
          <label for="concurrency-select">concurrencia:</label>
          <select id="concurrency-select">
            <option value="1">1 (secuencial)</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
          </select>
        </div>
        <div class="settings-item">
          <label for="timeout-select">timeout:</label>
          <select id="timeout-select">
            <option value="5000">5s</option>
            <option value="10000" selected>10s</option>
            <option value="15000">15s</option>
            <option value="30000">30s</option>
          </select>
        </div>
        <div class="settings-item" style="flex:1; min-width: 140px;">
          <label for="prompt-input">prompt:</label>
          <input id="prompt-input" type="text" value="Di 'OK' en una palabra." style="flex:1; width: 100%;">
        </div>
        <button id="run-btn" class="btn">verificar modelos</button>
        <button id="stop-btn" class="btn btn-danger" style="display:none;">detener</button>
        <button id="retry-btn" class="btn btn-secondary" style="display:none;">reintentar fallidos</button>
      </div>
    </div>

    <!-- Live Stats -->
    <div id="stats-container" style="display:none; flex-direction:column; gap:0.4rem;">
      <div class="stats-bar">
        <span class="stat-item">total: <strong id="stat-total">0</strong></span>
        <span>·</span>
        <span class="stat-item stat-ok">operativos: <strong id="stat-ok">0</strong></span>
        <span>·</span>
        <span class="stat-item stat-fail">fallas: <strong id="stat-fail">0</strong></span>
        <span>·</span>
        <span class="stat-item stat-warn">timeouts/espera: <strong id="stat-pending">0</strong></span>
        <span>·</span>
        <span class="stat-item">latencia media: <strong id="stat-latency">0</strong>ms</span>
      </div>
      <div class="progress-line">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Table Section -->
    <div id="results-container" style="display:flex; flex-direction:column; gap:0.6rem;">
      <div class="toolbar">
        <div class="filter-group">
          <button class="tab-btn active" data-filter="all">todos (<span id="cnt-all">0</span>)</button>
          <button class="tab-btn" data-filter="ok">operativos (<span id="cnt-ok">0</span>)</button>
          <button class="tab-btn" data-filter="fail">fallas (<span id="cnt-fail">0</span>)</button>
          <button class="tab-btn" data-filter="pending">pendientes (<span id="cnt-pending">0</span>)</button>
        </div>

        <div class="toolbar-right">
          <input type="text" id="search-input" class="search-input" placeholder="buscar modelo...">
          <div class="export-group">
            <button id="copy-active-btn" class="btn btn-secondary btn-sm" title="copiar array de ids operativos">copiar activos</button>
            <button id="export-json-btn" class="btn btn-secondary btn-sm" title="exportar a json">json</button>
            <button id="export-csv-btn" class="btn btn-secondary btn-sm" title="exportar a csv">csv</button>
          </div>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>modelo</th>
              <th>contexto</th>
              <th>estado</th>
              <th>latencia</th>
              <th>detalle</th>
              <th style="text-align:right;">acciones</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    // State
    const state = {
      models: [],
      isRunning: false,
      abortController: null,
      filter: 'all',
      searchQuery: '',
      results: new Map()
    };

    // Elements
    const apiKeyInput = document.getElementById('api-key');
    const toggleKeyBtn = document.getElementById('toggle-key-btn');
    const keyInfoEl = document.getElementById('key-info');
    const runBtn = document.getElementById('run-btn');
    const stopBtn = document.getElementById('stop-btn');
    const retryBtn = document.getElementById('retry-btn');
    const concurrencySelect = document.getElementById('concurrency-select');
    const timeoutSelect = document.getElementById('timeout-select');
    const promptInput = document.getElementById('prompt-input');

    const statsContainer = document.getElementById('stats-container');
    const statTotal = document.getElementById('stat-total');
    const statOk = document.getElementById('stat-ok');
    const statFail = document.getElementById('stat-fail');
    const statPending = document.getElementById('stat-pending');
    const statLatency = document.getElementById('stat-latency');
    const progressFill = document.getElementById('progress-fill');

    const resultsContainer = document.getElementById('results-container');
    const tableBody = document.getElementById('table-body');
    const searchInput = document.getElementById('search-input');
    const filterTabs = document.querySelectorAll('.tab-btn');

    const cntAll = document.getElementById('cnt-all');
    const cntOk = document.getElementById('cnt-ok');
    const cntFail = document.getElementById('cnt-fail');
    const cntPending = document.getElementById('cnt-pending');

    const copyActiveBtn = document.getElementById('copy-active-btn');
    const exportJsonBtn = document.getElementById('export-json-btn');
    const exportCsvBtn = document.getElementById('export-csv-btn');

    const themeToggle = document.getElementById('theme-toggle');
    const toast = document.getElementById('toast');

    // Theme
    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // Key management
    apiKeyInput.value = localStorage.getItem('openrouter_key') || '';
    if (apiKeyInput.value.trim()) {
      validateKey(apiKeyInput.value.trim());
    }

    apiKeyInput.addEventListener('input', () => {
      const val = apiKeyInput.value.trim();
      localStorage.setItem('openrouter_key', val);
      if (val.length > 20) {
        validateKey(val);
      } else {
        keyInfoEl.textContent = '';
      }
    });

    toggleKeyBtn.addEventListener('click', () => {
      if (apiKeyInput.type === 'password') {
        apiKeyInput.type = 'text';
        toggleKeyBtn.textContent = 'ocultar';
      } else {
        apiKeyInput.type = 'password';
        toggleKeyBtn.textContent = 'ver';
      }
    });

    async function validateKey(key) {
      try {
        const res = await fetch('https://openrouter.ai/api/v1/auth/key', {
          headers: { 'Authorization': `Bearer ${key}` }
        });
        if (res.ok) {
          const info = await res.json();
          const d = info.data || {};
          keyInfoEl.textContent = `key válida (${d.label || 'principal'}) · límite: ${d.limit != null ? '$' + d.limit : 'sin límite'} · uso: $${(d.usage || 0).toFixed(4)}`;
        } else {
          keyInfoEl.textContent = `key inválida o no autorizada (HTTP ${res.status})`;
        }
      } catch (e) {
        keyInfoEl.textContent = '';
      }
    }

    // Toast
    let toastTimeout;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Helpers
    function formatContext(tokens) {
      if (!tokens) return '-';
      if (tokens >= 1000000) return (tokens / 1000000).toFixed(1).replace('.0', '') + 'M';
      if (tokens >= 1000) return Math.round(tokens / 1000) + 'k';
      return tokens;
    }

    // Filter & Search
    filterTabs.forEach(btn => {
      btn.addEventListener('click', () => {
        filterTabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.filter = btn.dataset.filter;
        renderTable();
      });
    });

    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value.toLowerCase().trim();
      renderTable();
    });

    function updateCounters() {
      let total = state.models.length;
      let okCount = 0;
      let failCount = 0;
      let pendingCount = 0;
      let totalLatency = 0;
      let okLatencyCount = 0;

      for (const m of state.models) {
        const res = state.results.get(m.id);
        if (!res || res.status === 'pending' || res.status === 'testing') {
          pendingCount++;
        } else if (res.status === 'ok') {
          okCount++;
          if (res.latency) {
            totalLatency += res.latency;
            okLatencyCount++;
          }
        } else if (res.status === 'fail' || res.status === 'timeout') {
          failCount++;
        }
      }

      statTotal.textContent = total;
      statOk.textContent = okCount;
      statFail.textContent = failCount;
      statPending.textContent = pendingCount;
      statLatency.textContent = okLatencyCount > 0 ? Math.round(totalLatency / okLatencyCount) : 0;

      cntAll.textContent = total;
      cntOk.textContent = okCount;
      cntFail.textContent = failCount;
      cntPending.textContent = pendingCount;

      const completed = okCount + failCount;
      const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
      progressFill.style.width = `${pct}%`;

      if (failCount > 0 && !state.isRunning) {
        retryBtn.style.display = 'inline-flex';
      } else {
        retryBtn.style.display = 'none';
      }
    }

    function renderTable() {
      tableBody.innerHTML = '';
      const query = state.searchQuery;
      const filter = state.filter;

      const filtered = state.models.filter(m => {
        const res = state.results.get(m.id) || { status: 'pending' };
        if (filter === 'ok' && res.status !== 'ok') return false;
        if (filter === 'fail' && res.status !== 'fail' && res.status !== 'timeout') return false;
        if (filter === 'pending' && res.status !== 'pending' && res.status !== 'testing') return false;

        if (query) {
          const matchId = m.id.toLowerCase().includes(query);
          const matchName = (m.name || '').toLowerCase().includes(query);
          if (!matchId && !matchName) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        const tr = document.createElement('tr');
        const msg = state.models.length === 0 ? 'presiona [verificar modelos] para iniciar' : 'sin resultados';
        tr.innerHTML = `<td colspan="6" style="text-align:center; padding: 1.5rem; color: var(--muted); font-family: monospace;">${msg}</td>`;
        tableBody.appendChild(tr);
        return;
      }

      for (const m of filtered) {
        const res = state.results.get(m.id) || { status: 'pending', latency: null, detail: '' };
        const tr = document.createElement('tr');
        tr.id = `row-${m.id.replace(/[^a-zA-Z0-9_-]/g, '_')}`;

        let statusHtml = '';
        if (res.status === 'ok') statusHtml = `<span class="status-tag ok">ok</span>`;
        else if (res.status === 'fail') statusHtml = `<span class="status-tag fail">falla</span>`;
        else if (res.status === 'timeout') statusHtml = `<span class="status-tag timeout">timeout</span>`;
        else if (res.status === 'testing') statusHtml = `<span class="status-tag testing">probando...</span>`;
        else statusHtml = `<span class="status-tag pending">en espera</span>`;

        tr.innerHTML = `
          <td>
            <div class="model-name mono">${m.id}</div>
            ${m.name && m.name !== m.id ? `<div class="model-sub">${m.name}</div>` : ''}
          </td>
          <td class="mono">${formatContext(m.context_length)}</td>
          <td>${statusHtml}</td>
          <td class="mono">${res.latency != null ? res.latency + 'ms' : '-'}</td>
          <td><span class="error-text mono">${res.detail || '-'}</span></td>
          <td style="text-align:right;">
            <button class="btn btn-secondary btn-sm" onclick="copyId('${m.id}')" title="copiar id">copiar</button>
            <button class="btn btn-secondary btn-sm" onclick="testSingle('${m.id}')" title="probar de nuevo" ${state.isRunning ? 'disabled' : ''}>probar</button>
          </td>
        `;
        tableBody.appendChild(tr);
      }
    }

    function updateRow(modelId) {
      const rowId = `row-${modelId.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
      const row = document.getElementById(rowId);
      if (row) {
        const res = state.results.get(modelId) || { status: 'pending', latency: null, detail: '' };
        let statusHtml = '';
        if (res.status === 'ok') statusHtml = `<span class="status-tag ok">ok</span>`;
        else if (res.status === 'fail') statusHtml = `<span class="status-tag fail">falla</span>`;
        else if (res.status === 'timeout') statusHtml = `<span class="status-tag timeout">timeout</span>`;
        else if (res.status === 'testing') statusHtml = `<span class="status-tag testing">probando...</span>`;
        else statusHtml = `<span class="status-tag pending">en espera</span>`;

        row.children[2].innerHTML = statusHtml;
        row.children[3].textContent = res.latency != null ? res.latency + 'ms' : '-';
        row.children[4].innerHTML = `<span class="error-text mono">${res.detail || '-'}</span>`;
      } else {
        renderTable();
      }
      updateCounters();
    }

    window.copyId = function(id) {
      navigator.clipboard.writeText(id).then(() => showToast(`copiado: ${id}`));
    };

    // Test execution
    async function testModel(modelId, key, prompt, timeoutMs, parentSignal) {
      const start = Date.now();
      const localController = new AbortController();
      let timedOut = false;

      const timeoutId = setTimeout(() => {
        timedOut = true;
        localController.abort();
      }, timeoutMs);

      const onParentAbort = () => localController.abort();
      if (parentSignal) parentSignal.addEventListener('abort', onParentAbort);

      state.results.set(modelId, { status: 'testing', latency: null, detail: 'conectando...' });
      updateRow(modelId);

      try {
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${key}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin || 'https://openrouter.ai',
            'X-Title': 'anybody'
          },
          signal: localController.signal,
          body: JSON.stringify({
            model: modelId,
            messages: [{ role: 'user', content: prompt }],
            max_tokens: 10
          })
        });

        clearTimeout(timeoutId);
        if (parentSignal) parentSignal.removeEventListener('abort', onParentAbort);

        const dur = Date.now() - start;
        const data = await res.json().catch(() => ({}));

        if (res.ok && !data.error) {
          const reply = data.choices?.[0]?.message?.content || 'OK';
          state.results.set(modelId, {
            status: 'ok',
            latency: dur,
            detail: `"${reply.trim()}"`
          });
        } else {
          const errMsg = data.error?.message || (res.status === 429 ? '429 rate limit' : `HTTP ${res.status}`);
          state.results.set(modelId, {
            status: 'fail',
            latency: dur,
            detail: errMsg
          });
        }
      } catch (err) {
        clearTimeout(timeoutId);
        if (parentSignal) parentSignal.removeEventListener('abort', onParentAbort);

        const dur = Date.now() - start;
        if (timedOut || err.name === 'AbortError') {
          if (parentSignal && parentSignal.aborted && !timedOut) {
            state.results.set(modelId, { status: 'pending', latency: null, detail: 'cancelado' });
          } else {
            state.results.set(modelId, {
              status: 'timeout',
              latency: dur,
              detail: `timeout (${timeoutMs / 1000}s)`
            });
          }
        } else {
          state.results.set(modelId, {
            status: 'fail',
            latency: dur,
            detail: err.message || 'error de conexión'
          });
        }
      }

      updateRow(modelId);
    }

    window.testSingle = async function(modelId) {
      const key = apiKeyInput.value.trim();
      if (!key) {
        showToast('falta la api key');
        apiKeyInput.focus();
        return;
      }
      const timeoutMs = parseInt(timeoutSelect.value, 10);
      const prompt = promptInput.value.trim() || 'hola';
      showToast(`probando ${modelId}...`);
      await testModel(modelId, key, prompt, timeoutMs, null);
    };

    async function runWorkerPool(items, concurrency, workerFn) {
      let index = 0;
      const workers = Array.from({ length: Math.min(concurrency, items.length) }, async () => {
        while (index < items.length && !state.abortController?.signal.aborted) {
          const currentIndex = index++;
          await workerFn(items[currentIndex]);
        }
      });
      await Promise.all(workers);
    }

    runBtn.onclick = async () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        showToast('ingresa tu api key de openrouter');
        apiKeyInput.focus();
        return;
      }

      setRunning(true);
      statsContainer.style.display = 'flex';
      resultsContainer.style.display = 'flex';

      try {
        const res = await fetch('https://openrouter.ai/api/v1/models', {
          headers: { 'Authorization': `Bearer ${key}` }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        state.models = (data.data || []).filter(m => m.id.endsWith(':free') || (m.pricing && m.pricing.prompt === '0' && m.pricing.completion === '0'));
        state.models.sort((a, b) => a.id.localeCompare(b.id));

        if (state.models.length === 0) {
          showToast('no se encontraron modelos gratuitos');
          setRunning(false);
          return;
        }

        state.results.clear();
        for (const m of state.models) {
          state.results.set(m.id, { status: 'pending', latency: null, detail: 'en espera' });
        }

        renderTable();
        updateCounters();
      } catch (err) {
        showToast(`error al listar modelos: ${err.message}`);
        setRunning(false);
        return;
      }

      const concurrency = parseInt(concurrencySelect.value, 10);
      const timeoutMs = parseInt(timeoutSelect.value, 10);
      const prompt = promptInput.value.trim() || 'hola';

      state.abortController = new AbortController();

      await runWorkerPool(state.models, concurrency, async (model) => {
        if (state.abortController.signal.aborted) return;
        await testModel(model.id, key, prompt, timeoutMs, state.abortController.signal);
      });

      showToast(state.abortController.signal.aborted ? 'verificación detenida' : 'verificación completa');
      setRunning(false);
    };

    stopBtn.onclick = () => {
      if (state.abortController) state.abortController.abort();
      setRunning(false);
    };

    retryBtn.onclick = async () => {
      const key = apiKeyInput.value.trim();
      if (!key) return;

      const failedModels = state.models.filter(m => {
        const r = state.results.get(m.id);
        return r && (r.status === 'fail' || r.status === 'timeout');
      });

      if (failedModels.length === 0) return;

      setRunning(true);
      const concurrency = parseInt(concurrencySelect.value, 10);
      const timeoutMs = parseInt(timeoutSelect.value, 10);
      const prompt = promptInput.value.trim() || 'hola';

      state.abortController = new AbortController();

      for (const m of failedModels) {
        state.results.set(m.id, { status: 'pending', latency: null, detail: 'reintentando...' });
        updateRow(m.id);
      }

      await runWorkerPool(failedModels, concurrency, async (model) => {
        if (state.abortController.signal.aborted) return;
        await testModel(model.id, key, prompt, timeoutMs, state.abortController.signal);
      });

      setRunning(false);
    };

    function setRunning(running) {
      state.isRunning = running;
      if (running) {
        runBtn.style.display = 'none';
        stopBtn.style.display = 'inline-flex';
        apiKeyInput.disabled = true;
      } else {
        runBtn.style.display = 'inline-flex';
        stopBtn.style.display = 'none';
        apiKeyInput.disabled = false;
        renderTable();
      }
      updateCounters();
    }

    // Export & copy
    copyActiveBtn.onclick = () => {
      const active = state.models
        .filter(m => {
          const r = state.results.get(m.id);
          return r && r.status === 'ok';
        })
        .map(m => m.id);

      if (active.length === 0) {
        showToast('no hay modelos operativos');
        return;
      }

      navigator.clipboard.writeText(JSON.stringify(active, null, 2)).then(() => {
        showToast(`copiados ${active.length} modelos`);
      });
    };

    exportJsonBtn.onclick = () => {
      const exportData = state.models.map(m => {
        const r = state.results.get(m.id) || {};
        return {
          id: m.id,
          name: m.name || m.id,
          context_length: m.context_length,
          status: r.status || 'untested',
          latency_ms: r.latency || null,
          detail: r.detail || ''
        };
      });

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      downloadBlob(blob, `openrouter-free-models-${Date.now()}.json`);
    };

    exportCsvBtn.onclick = () => {
      const headers = ['id', 'nombre', 'contexto', 'estado', 'latencia_ms', 'detalle'];
      const rows = state.models.map(m => {
        const r = state.results.get(m.id) || {};
        return [
          `"${m.id}"`,
          `"${(m.name || m.id).replace(/"/g, '""')}"`,
          m.context_length || '',
          `"${r.status || 'untested'}"`,
          r.latency || '',
          `"${(r.detail || '').replace(/"/g, '""')}"`
        ].join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      downloadBlob(blob, `openrouter-free-models-${Date.now()}.csv`);
    };

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Initial render
    renderTable();
    updateCounters();
  </script>
</body>
</html>
